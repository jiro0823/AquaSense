; Run commands from the repository root with: pio run -d Hardware
[platformio]
default_envs = water-monitor, feeder, water-quality, water-quality-legacy

[env]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[water-libraries]
lib_deps =
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

[env:feeder]
build_src_filter = -<*> +<feeder/>
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    https://github.com/madhephaestus/ESP32Servo/archive/refs/tags/1.1.2.zip

[env:water-quality]
build_src_filter = -<*> +<water-quality/>
lib_deps =
    ${water-libraries.lib_deps}
    bblanchon/ArduinoJson@6.21.5

[env:water-quality-legacy]
build_src_filter = -<*> +<water-quality-legacy/>
lib_deps = ${water-libraries.lib_deps}

; Modular migration of the supplied ORP + LCD + DS3231 Arduino sketch.
; Existing targets remain isolated until physical acceptance is complete.
[env:water-monitor]
build_src_filter =
    -<*>
    +<main.cpp>
    +<sensors/>
    +<communication/>
    +<display/>
    +<services/>
    +<actuators/>
    +<controllers/>
    +<../test/compile_checks.cpp>
lib_deps =
    ${water-libraries.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    adafruit/RTClib@2.1.4
    adafruit/Adafruit BusIO@1.16.1
    bblanchon/ArduinoJson@6.21.5
    https://github.com/madhephaestus/ESP32Servo/archive/refs/tags/1.1.2.zip
